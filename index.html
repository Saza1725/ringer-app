*{box-sizing:border-box}

.topr{display:flex;align-items:center;gap:10px}

.savestate.ok{color:var(--good)} .savestate.bad{color:var(--warn);border-color:var(--warn)}
main{max-width:620px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.ph{margin-top:4px}

.eyebrow{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.herochips{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;align-items:center} .gap{gap:8px} .wrap{flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.btn{appearance:none;border:0;background:var(--red);color:#fff;font-weight:600;padding:11px 16px;border-radius:10px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#ff7b7f;border:1px solid #6b2a2d}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.wide{width:100%}
.iconbtn{appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:1.1rem}
.iconbtn.sm{width:32px;height:32px;font-size:.85rem}
.link{background:none;border:0;color:var(--blue);padding:0;cursor:pointer;text-decoration:underline;font:inherit}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.t-kraft{color:#fff;background:var(--red);border-color:var(--red)} .pill.t-ringen{color:#fff;background:var(--blue);border-color:var(--blue)}
.pill.t-schwimmen{color:#7fd4ff;border-color:#2c5a73} .pill.t-locker{color:var(--good);border-color:#285a44} .pill.t-ruhe{color:var(--muted)}
.pill.comp{color:var(--warn);border-color:#6b5226} .pill.soft{background:transparent} .pill.vid{color:var(--good);border-color:#285a44}
.note{background:#1d2430;border:1px solid #2f3e57;border-left:4px solid var(--blue);border-radius:12px;padding:12px 14px;font-size:.94rem}
.note.warn{background:#2a2216;border-color:#5a4526;border-left-color:var(--warn)}
.track{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden} .track i{display:block;height:100%;background:var(--red);border-radius:6px}
.track.big{height:8px}
.planhead{display:flex;justify-content:space-between;align-items:baseline}
.exlist,.edlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exrow{display:grid;grid-template-columns:1fr;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exname{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer;color:var(--text)}
.exname:hover{color:var(--blue)}
.sets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.setb{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.setb.on{background:var(--red);border-color:var(--red);color:#fff}
.kg{grid-column:1/-1;display:flex;align-items:center;gap:6px}
.kg input{width:120px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
textarea{resize:vertical;font-size:.85rem}
.kg input{width:130px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.fl input,.fl select,.fl textarea{color:var(--text);font-size:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.nutgrid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media(max-width:380px){.nutgrid{grid-template-columns:1fr;justify-items:center}.bars{width:100%}}
.ring{position:relative;width:132px;height:132px}
.ring circle{fill:none;stroke-width:12} .rbg{stroke:var(--surface2)} .rfg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .4s}
.rfg.over{stroke:var(--warn)}
.rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rtxt b{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums} .rtxt span{font-size:.75rem;color:var(--muted);text-transform:uppercase} .rtxt small{font-size:.72rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.mbar .mrow{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px}
.mbar:nth-child(1) i{background:var(--red)} .mbar:nth-child(2) i{background:var(--blue)} .mbar:nth-child(3) i{background:var(--warn)}
.meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}

.mlabel{color:var(--muted);font-size:.8rem;text-transform:uppercase;padding-top:2px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}

.week{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:36px 1fr 1.3fr;gap:8px;align-items:center}
.wrow.today .wd{color:var(--red)}
.wd{font-family:var(--display);font-size:1.2rem}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.li:hover{border-color:#3d4450}
.li>span:first-child{display:flex;flex-direction:column;min-width:0}
.li small{font-size:.8rem}
.lh{font-family:var(--display);text-transform:uppercase;color:var(--muted);margin:10px 0 2px;letter-spacing:.06em}
.rnum{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap} .rnum b{font-size:1.05rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{flex:1}
.catsel{max-width:100%}

.ed{gap:8px}
.datenav{display:flex;justify-content:space-between;align-items:center;gap:10px}

.erow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:4px 0}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis>div{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.kpis b{font-family:var(--display);font-size:1.5rem;line-height:1.1} .kpis small{color:var(--muted);font-size:.74rem}
.kpis .full{grid-column:1/-1;margin:0}
.addbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;background:var(--surface2);padding:12px;border-radius:12px}
.addbox .btn{grid-column:1/-1}
.ingrow{display:grid;grid-template-columns:1fr 80px auto;gap:6px;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:20;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:24px;font-weight:600;font-size:.9rem;transition:.2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function parseFoods(src, origin) {
  let cat = ''; const out = [];
  src.trim().split('\n').forEach(l => {
    l = l.trim(); if (!l) return;
    if (l[0] === '#') { cat = l.slice(1); return; }
    const p = l.split('|'); const num = v => v === undefined ? undefined : (v === '-' ? null : parseFloat(v));
    const carb = num(p[4]);
    let be = num(p[5]); if (be === undefined) be = carb == null ? null : r1(carb / 12);
    out.push({id: 'f_' + slug(p[0]), name: p[0], cat, kcal: num(p[1]), fat: num(p[2]), prot: num(p[3]), carb, be, src: origin});
  });
  return out;
}

function sumNut(list) {
  const t = {kcal: 0, fat: 0, prot: 0, carb: 0, missing: []};
  list.forEach(({f, g}) => { const fo = typeof f === 'string' ? food(f) : f; if (!fo) return;
    ['kcal','fat','prot','carb'].forEach(k => { if (fo[k] == null) { if (!t.missing.includes(fo.name)) t.missing.push(fo.name); } else t[k] += fo[k] * g / 100; }); });
  return t;
}
function rNut(r) { const t = sumNut(r.ing); const p = r.portions || 1; return {kcal: t.kcal / p, fat: t.fat / p, prot: t.prot / p, carb: t.carb / p, missing: t.missing}; }
function rPrice(r) {
  if (S.recipePrice[r.id] != null) return {v: S.recipePrice[r.id], own: true, partial: false};
  let v = 0, partial = false; r.ing.forEach(i => { const p = price(i.f); if (p == null) partial = true; else v += p * i.g / 1000; });
  return {v: v / (r.portions || 1), own: false, partial};
}
function entryNut(e) {
  if (e.k === 'r') { const r = recipe(e.ref); if (!r) return {kcal:0,fat:0,prot:0,carb:0,missing:[]}; const n = rNut(r); return {kcal: n.kcal * e.q, fat: n.fat * e.q, prot: n.prot * e.q, carb: n.carb * e.q, missing: n.missing}; }
  return sumNut([{f: e.ref, g: e.q}]);
}
function dayNut(d) { const t = {kcal:0,fat:0,prot:0,carb:0,missing:[]}; (S.diary[d] || []).forEach(e => { const n = entryNut(e); ['kcal','fat','prot','carb'].forEach(k => t[k] += n[k]); n.missing.forEach(m => { if (!t.missing.includes(m)) t.missing.push(m); }); }); return t; }
function targets(d) {

  const prot = bw * S.profile.protF, fat = bw * S.profile.fatF; const carb = Math.max(0, (kcal - prot * 4 - fat * 9) / 4);
  return {kcal, prot, fat, carb};
}

// ===== Tagesvorschlag
function suggestDay(target) {
  const by = c => RECIPES().filter(r => r.cat === c);
  let best = null;
  for (let t = 0; t < 80; t++) {
    const pick = MEALS.map(slot => { const l = by(slot); return l.length ? {slot, r: l[Math.floor(Math.random() * l.length)], q: 1} : null; }).filter(Boolean);
    const tot = () => pick.reduce((s, x) => s + rNut(x.r).kcal * x.q, 0);
    const fac = target / tot(); pick.forEach(x => x.q = Math.min(2.5, Math.max(0.5, Math.round(fac * 4) / 4)));
    for (let k = 0; k < 24; k++) {
      const diff = target - tot(); if (Math.abs(diff) <= 60) break;
      let bs = null; pick.forEach(x => [0.25, -0.25].forEach(s => { const nq = x.q + s; if (nq < 0.5 || nq > 2.5) return; const nd = Math.abs(diff - rNut(x.r).kcal * s); if (!bs || nd < bs.nd) bs = {x, s, nd}; }));
      if (!bs || bs.nd >= Math.abs(diff)) break; bs.x.q += bs.s;
    }
    const err = Math.abs(target - tot());
    if (!best || err < best.err) best = {pick: pick.map(x => ({slot: x.slot, ref: x.r.id, q: x.q})), err, tot: tot()};
    if (err <= 100) break;
  }
  return best;
}
function applySuggestion(d, sug) { S.diary[d] = sug.pick.map(p => ({id: uid('e'), meal: p.slot, k: 'r', ref: p.ref, q: p.q})); }

if (!S.seeded) { const t = TODAY(); if (!(S.diary[t] || []).length) applySuggestion(t, suggestDay(targets(t).kcal)); S.seeded = true; save(); }

function idbGet(k) { return new Promise(res => { try { if (!idb) return res(null); const tx = idb.transaction('videos', 'readonly'); const rq = tx.objectStore('videos').get(k); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); } catch (e) { res(null); } }); }
function idbPut(k, v) { return new Promise(res => { try { if (!idb) return res(false); const tx = idb.transaction('videos', 'readwrite'); tx.objectStore('videos').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); }

function nextComp() { const t = TODAY(); return S.comps.filter(c => c.d >= t).sort((a, b) => a.d.localeCompare(b.d))[0]; }
function daysUntil(d) { return Math.round((parseD(d) - parseD(TODAY())) / 864e5); }
function cutWarning() {
  const c = nextComp(); if (!c || daysUntil(c.d) > 14) return null;
  const w = [...S.weights].sort((a, b) => a.d.localeCompare(b.d)); if (w.length < 2) return null;
  const last = w[w.length - 1]; const ref = [...w].reverse().find(x => daysUntil(x.d) <= daysUntil(last.d) - 7 || x.d <= addDays(last.d, -7));
  if (!ref || ref === last) return null; const drop = (ref.kg - last.kg) / ref.kg;
  return drop > 0.03 ? {drop, c} : null;
}
function vHeute() {

function lastWeight(ex, before) { const ds = Object.keys(S.logs).filter(d => d < before).sort().reverse(); for (const d of ds) { const w = S.logs[d].w || {}; const v = Object.entries(w).filter(([k, x]) => k.startsWith(ex + '|') && x !== '').map(([, x]) => parseFloat(String(x).replace(',', '.'))).filter(x => !isNaN(x)); if (v.length) return Math.max(...v); } return null; }

function drawCharts() {

    else {
      const W = 320, H = 150, P = {l: 34, r: 12, t: 12, b: 22}; const xs = w.map(x => parseD(x.d).getTime()); const mn = Math.min(...w.map(x => x.kg), +S.profile.wMin || Infinity), mx = Math.max(...w.map(x => x.kg), +S.profile.wMax || -Infinity);
      const lo = Math.floor(mn - 0.5), hi = Math.ceil(mx + 0.5); const X = t => P.l + (t - xs[0]) / ((xs[xs.length - 1] - xs[0]) || 1) * (W - P.l - P.r); const Y = v => P.t + (hi - v) / ((hi - lo) || 1) * (H - P.t - P.b);
      const pts = w.map((x, i) => [X(xs[i]), Y(x.kg)]); const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - P.b} L${pts[0][0].toFixed(1)} ${H - P.b} Z`;
      const band = S.profile.wMin && S.profile.wMax ? `<rect x="${P.l}" y="${Y(+S.profile.wMax)}" width="${W - P.l - P.r}" height="${Math.max(0, Y(+S.profile.wMin) - Y(+S.profile.wMax))}" class="band"/>` : '';
      const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${P.l - 6}" y="${Y(v) + 3}" class="ax" text-anchor="end">${de(v, v % 1 ? 1 : 0)}</text>`).join('');
      const e = pts[pts.length - 1];
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">${band}${grid}<path d="${area}" class="area"/><path d="${line}" class="ln"/><circle cx="${e[0]}" cy="${e[1]}" r="4.5" class="dot"/><text x="${P.l}" y="${H - 6}" class="ax">${fmtDate(w[0].d).slice(4, 10)}</text><text x="${W - P.r}" y="${H - 6}" class="ax" text-anchor="end">${fmtDate(w[w.length - 1].d).slice(4, 10)}</text></svg>`;
    }
  }
  const tc = $('#tchart'); if (tc) {
    const mon = d => addDays(d, -wdIdx(d)); const cur = mon(TODAY()); const weeks = Array.from({length: 8}, (_, i) => addDays(cur, -7 * (7 - i)));
    const cnt = weeks.map(ws => Object.keys(S.logs).filter(d => d >= ws && d < addDays(ws, 7) && Object.values(S.logs[d].sets || {}).some(Boolean)).length);
    const W = 320, H = 130, P = {l: 22, b: 22, t: 10}; const bw = (W - P.l) / 8; const max = 7;
    tc.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainingstage je Woche">${[0, 3, 6].map(v => `<line x1="${P.l}" x2="${W}" y1="${P.t + (max - v) / max * (H - P.t - P.b)}" y2="${P.t + (max - v) / max * (H - P.t - P.b)}" class="grid"/><text x="${P.l - 6}" y="${P.t + (max - v) / max * (H - P.t - P.b) + 3}" class="ax" text-anchor="end">${v}</text>`).join('')}
    ${cnt.map((c, i) => { const h = c / max * (H - P.t - P.b); const x = P.l + i * bw + bw * 0.2; return `<rect x="${x}" y="${H - P.b - h}" width="${bw * 0.6}" height="${h}" rx="3" class="${i === 7 ? 'barc now' : 'barc'}"/>${c ? `<text x="${x + bw * 0.3}" y="${H - P.b - h - 4}" class="ax" text-anchor="middle">${c}</text>` : ''}<text x="${x + bw * 0.3}" y="${H - 6}" class="ax" text-anchor="middle">${i === 7 ? 'jetzt' : 'KW' + kw(weeks[i])}</text>`; }).join('')}</svg>`;
  }
}
function kw(s) { const d = parseD(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

// ===== Pausen-Timer
let rest = {end: 0, iv: null, ac: null};
function startRest(sec) {
  if (!sec) return; try { rest.ac = rest.ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  rest.end = Date.now() + sec * 1000; clearInterval(rest.iv); const bar = $('#restbar'); bar.hidden = false;
  const tick = () => { const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000)); bar.innerHTML = `<span>Pause</span><b class="num">${Math.floor(left / 60)}:${pad(left % 60)}</b><button class="btn sm ghost" data-act="restAdd">+30 s</button><button class="btn sm ghost" data-act="restStop">Fertig</button>`;
    if (left <= 0) { clearInterval(rest.iv); beep(); bar.innerHTML = `<span>Pause vorbei</span><b>Nächster Satz</b><button class="btn sm ghost" data-act="restStop">OK</button>`; } };
  tick(); rest.iv = setInterval(tick, 250);
}
function beep() { try { const a = rest.ac; if (!a) return; [0, 0.25, 0.5].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(0.2, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.18); o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.2); }); } catch (e) {} }

async function saveFile(name, text) {
  if (DL) { try { await DL.save({filename: name, data: text}); toast('Gespeichert: ' + name); } catch (e) { toast(e && e.code === 'declined' ? 'Speichern abgebrochen' : 'Speichern hier nicht möglich – bitte kopieren'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text])); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Datei wird gespeichert'); } catch (e) { toast('Speichern hier nicht möglich – bitte kopieren'); }
}

  newPlan: () => { const p = {id: uid('p'), name: 'Neuer Plan', type: 'kraft', items: []}; S.plans.push(p); save(); UI.editPlan = p.id; render(); },
  dupPlan: () => { const p = plan(UI.editPlan); const c = JSON.parse(JSON.stringify(p)); c.id = uid('p'); c.name = p.name + ' (Kopie)'; c.base = false; S.plans.push(c); save(); UI.editPlan = c.id; render(); toast('Plan dupliziert'); },
  delPlan: () => confirmBox('Diesen Plan löschen?', 'Löschen', () => { const id = UI.editPlan; S.plans = S.plans.filter(p => p.id !== id); S.week.forEach(w => { if (w.plan === id) w.plan = ''; }); UI.editPlan = null; save(); render(); }),
  mv: b => { const p = plan(UI.editPlan), i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= p.items.length) return; [p.items[i], p.items[j]] = [p.items[j], p.items[i]]; save(); render(); },
  rmItem: b => { plan(UI.editPlan).items.splice(+b.dataset.i, 1); save(); render(); },
  pickEx: () => pickerSheet('Übung hinzufügen', EXS().map(e => [e.id, e.name, e.cat + ' · ' + e.muscles]), 'pickExDo'),
  pickExDo: b => { plan(UI.editPlan).items.push({ex: b.dataset.v, sets: 3, reps: '10', weight: '', rest: 60, note: ''}); save(); closeSheet(); render(); toast('Übung hinzugefügt'); },
  nDate: b => { UI.nDate = addDays(UI.nDate, +b.dataset.v); render(); },
  gotoDay: b => { UI.nDate = b.dataset.v; UI.nSub = 'tag'; render(); },
  addRecipe: b => { UI.nDate = b.dataset.d; pickerSheet('Rezept hinzufügen', RECIPES().map(r => [r.id, r.name, r.cat + ' · ' + de(rNut(r).kcal) + ' kcal'])  , 'rcinfo'); },
  addFood: b => { UI.nDate = b.dataset.d; pickerSheet('Lebensmittel hinzufügen', FOODS().map(f => [f.id, f.name, f.cat + ' · ' + de(f.kcal) + ' kcal/100 g']), 'fdinfo'); },
  suggest: b => { const d = b.dataset.d; const go = () => { applySuggestion(d, suggestDay(targets(d).kcal)); save(); render(); toast('Neuer Tagesplan: ' + de(dayNut(d).kcal) + ' kcal'); }; (S.diary[d] || []).length ? confirmBox('Einträge dieses Tages ersetzen?', 'Ersetzen', go) : go(); },
  clearDay: b => confirmBox('Alle Einträge dieses Tages löschen?', 'Leeren', () => { S.diary[b.dataset.d] = []; save(); render(); }),
  rmEntry: b => { const d = UI.tab === 'heute' ? TODAY() : UI.nDate; S.diary[d] = (S.diary[d] || []).filter(e => e.id !== b.dataset.v); save(); render(); },
  rcCat: b => { UI.rcCat = b.dataset.v; render(); },
  rcinfo: b => { rcScale = 1; rcSheet(b.dataset.v); },
  rcQ: b => { rcScale = Math.max(0.25, rcScale + +b.dataset.d); rcSheet(b.dataset.v); },
  rcAdd: b => { const d = $('#rcDate').value || UI.nDate; (S.diary[d] = S.diary[d] || []).push({id: uid('e'), meal: $('#rcMeal').value, k: 'r', ref: b.dataset.v, q: rcScale}); save(); closeSheet(); render(); toast('Zum ' + fmtDate(d) + ' hinzugefügt'); },
  newRecipe: () => recipeEditor(null), editRecipe: b => recipeEditor(b.dataset.v),
  copyRecipe: b => { const r = recipe(b.dataset.v); const c = JSON.parse(JSON.stringify(r)); c.id = uid('rc'); c.name = r.name + ' (eigen)'; c.custom = true; S.recipesCustom.push(c); save(); recipeEditor(c.id); },
  delRecipe: b => confirmBox('Rezept löschen?', 'Löschen', () => { S.recipesCustom = S.recipesCustom.filter(r => r.id !== b.dataset.v); save(); render(); }),
  reAddRow: () => { $('#reRows').insertAdjacentHTML('beforeend', ingRow({n: '', g: ''})); },
  reRmRow: b => { b.closest('.ingrow').remove(); reCalc(); },
  reSave: b => { const byN = Object.fromEntries(FOODS().map(f => [f.name, f])); const rows = reRead().filter(x => byN[x.n] && x.g > 0); const name = $('#reName').value.trim(); if (!name) return toast('Name eintragen'); if (!rows.length) return toast('Mindestens eine Zutat aus der Liste');
    const r = {id: b.dataset.v, name, cat: $('#reCat').value, family: '', tags: $('#reTags').value.split(',').map(x => x.trim()).filter(Boolean), min: num($('#reMin').value) || 0, portions: Math.max(1, num($('#rePor').value) || 1), ing: rows.map(x => ({f: byN[x.n].id, g: x.g})), steps: $('#reSteps').value.split('\n').map(x => x.trim()).filter(Boolean), custom: true};
    const i = S.recipesCustom.findIndex(x => x.id === r.id); if (i >= 0) S.recipesCustom[i] = r; else S.recipesCustom.push(r); save(); UI.nSub = 'rezepte'; render(); rcSheet(r.id, 1); toast('Rezept gespeichert'); },
  fdinfo: b => fdSheet(b.dataset.v),
  fdAdd: b => { const g = num($('#fdG').value); if (!g) return toast('Menge eintragen'); const d = $('#fdDate').value || UI.nDate; (S.diary[d] = S.diary[d] || []).push({id: uid('e'), meal: $('#fdMeal').value, k: 'f', ref: b.dataset.v, q: g}); save(); closeSheet(); render(); toast('Hinzugefügt'); },
  newFood: () => foodEditor(),
  nfSave: () => { const n = $('#nfName').value.trim(); if (!n) return toast('Name eintragen'); const id = 'f_own_' + slug(n) + '_' + Math.random().toString(36).slice(2, 5); const c = num($('#nfC').value); S.foodsCustom.push({id, name: n, cat: 'Eigene', kcal: num($('#nfK').value), prot: num($('#nfP').value), carb: c, fat: num($('#nfF').value), be: c == null ? null : r1(c / 12), src: 'eigen'}); const pr = num($('#nfPr').value); if (pr != null) S.prices[id] = pr; save(); closeSheet(); render(); toast('Lebensmittel gespeichert'); },
  delFood: b => confirmBox('Lebensmittel löschen?', 'Löschen', () => { S.foodsCustom = S.foodsCustom.filter(f => f.id !== b.dataset.v); save(); render(); }),
  planWeek: b => { const all = b.dataset.v === 'all'; const go = () => { weekDates().forEach(d => { if (all || !(S.diary[d] || []).length) applySuggestion(d, suggestDay(targets(d).kcal)); }); S.shopDone = {}; save(); render(); toast('Woche geplant'); }; all ? confirmBox('Alle 7 Tage neu vorschlagen? Bestehende Einträge werden ersetzt.', 'Neu vorschlagen', go) : go(); },
  shopReset: () => { S.shopDone = {}; save(); render(); },
  addW: () => { const kg = num($('#wKg').value), d = $('#wD').value; if (!kg || !d) return toast('Gewicht eintragen'); S.weights = S.weights.filter(x => x.d !== d); S.weights.push({d, kg}); if (!S.profile.bwSet) { S.profile.bw = kg; S.profile.bwSet = true; } save(); render(); toast('Eingetragen'); },
  rmW: b => { S.weights = S.weights.filter(x => x.d !== b.dataset.v); save(); render(); },
  rmExamples: () => { S.weights = S.weights.filter(x => !x.ex); S.comps = S.comps.filter(x => !x.ex); save(); render(); toast('Beispieldaten entfernt'); }
};
function importJSON(txt) { try { const o = JSON.parse(txt); if (!o || !o.profile || !o.plans) throw 0; S = Object.assign(defaultState(), o); save(); closeSheet(); render(); toast('Sicherung geladen'); } catch (e) { toast('Das ist keine gültige Sicherung'); } }

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const f = A[b.dataset.act]; if (f) { e.preventDefault && b.tagName !== 'INPUT' && b.tagName !== 'LABEL' && e.preventDefault(); f(b, e); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); if (e.key === 'Enter' && e.target.matches('tr[data-act]')) A[e.target.dataset.act](e.target); });
document.addEventListener('input', e => { const el = e.target; const k = el.dataset.in;
  if (el.closest('#reRows') || el.id === 'rePor') return reCalc();
  if (k === 'exQ') { UI.exQ = el.value; const pos = el.selectionStart; render(); const n = $('[data-in="exQ"]'); n.focus(); n.setSelectionRange(pos, pos); }
  if (k === 'fdQ') { UI.fdQ = el.value; const pos = el.selectionStart; render(); const n = $('[data-in="fdQ"]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => { const el = e.target; const k = el.dataset.in; if (!k) return;
  if (k === 'weekType') { S.week[+el.dataset.i].type = el.value; save(); }
  if (k === 'weekPlan') { S.week[+el.dataset.i].plan = el.value; save(); }
  if (k === 'planName') { plan(UI.editPlan).name = el.value; save(); }
  if (k === 'planType') { plan(UI.editPlan).type = el.value; save(); }
  if (k === 'it') { const it = plan(UI.editPlan).items[+el.dataset.i]; const f = el.dataset.f; it[f] = (f === 'sets' || f === 'rest') ? Math.max(0, parseInt(el.value) || 0) : el.value; save(); render(); }
  if (k === 'w') { const t = TODAY(); S.logs[t] = S.logs[t] || {sets: {}, w: {}}; S.logs[t].w = S.logs[t].w || {}; if (S.logs[t].plan === undefined) S.logs[t].plan = dayPlanId(t); S.logs[t].w[el.dataset.k] = el.value; save(); }
  if (k === 'link') { S.links[el.dataset.v] = el.value.trim(); save(); exSheet(el.dataset.v); }
  if (k === 'addToPlan' && el.value) { plan(el.value).items.push({ex: el.dataset.v, sets: 3, reps: '10', weight: '', rest: 60, note: ''}); save(); toast('Zu „' + plan(el.value).name + '“ hinzugefügt'); el.value = ''; }
  if (k === 'video') { const f = el.files[0]; if (!f) return; if (!idb) await openIDB(); const ok = await idbPut(el.dataset.v, f); if (ok) { videoKeys.add(el.dataset.v); toast('Video gespeichert'); exSheet(el.dataset.v); render(); } else toast('Video konnte hier nicht gespeichert werden'); }
  if (k === 'rcPrice') { const v = num(el.value); if (v == null) delete S.recipePrice[el.dataset.v]; else S.recipePrice[el.dataset.v] = v; save(); render(); }
  if (k === 'fdPrice') { const v = num(el.value); if (v == null) delete S.prices[el.dataset.v]; else S.prices[el.dataset.v] = v; save(); render(); }
  if (k === 'fdCat') { UI.fdCat = el.value; render(); }
  if (k === 'shop') { S.shopDone[el.dataset.v] = el.checked; save(); render(); }
  if (k === 'impFile') { const f = el.files[0]; if (f) importJSON(await f.text()); }
});

// ===== Start
shell();
const h0 = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h0)) UI.tab = h0;
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== UI.tab) { UI.tab = h; render(); } });
render(); loadVideoKeys();
